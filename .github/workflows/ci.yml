name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustiq
          POSTGRES_PASSWORD: trustiq
          POSTGRES_DB: trustiq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trustiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Tests (embedded PGlite)
        run: npm test
      - name: Tests (PostgreSQL 16)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://trustiq:trustiq@localhost:5432/trustiq_test
